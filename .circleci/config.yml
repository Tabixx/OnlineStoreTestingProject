version: 2.1
orbs:
  cypress: cypress-io/cypress@6.1.0
workflows:
  build:
    jobs:
      - cypress/run:
          name: run-authentication-tests
          cypress-command: npx cypress run --spec cypress/e2e/AuthenticationTestSuite.cy.js
      - cypress/run:
          name: run-purchasing-tests
          cypress-command: npx cypress run --spec cypress/e2e/PurchasingProcessTestSuite.cy.js